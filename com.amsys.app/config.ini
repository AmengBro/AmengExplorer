[system]
root = D:\Codewhale\workspace\amsys\root

[mounts]
; 留空则使用 <root>/<name>
home =
usr  =
tmp  =

[floder]
enabled = true

[security]
block_dotdot = true

[tools]
; 工具别名: <别名> = <exe路径>
vi = .\root\bin\vim92\vim.exe
vim = .\root\bin\vim92\vim.exe
nvim = .\root\bin\nvim\bin\nvim.exe
calc = calc.exe
spf = .\root\bin\super_file.exe
nano =.\root\bin\nano\nano.exe

[commands]
; 命令别名: 无提示，可在管道中运行
apm = .\root\bin\apm.exe

[hijack]
; 每工具劫持特性: env,cwd,args 逗号组合 / none / all(默认)
; 不配置的工具默认 all（环境注入+目录同步+参数转换）
; vi = all
; nano = env,cwd
; apm = none
